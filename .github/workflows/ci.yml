name: ContractIQ checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contractiq-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            contractiq-backend/requirements*.txt
            contractiq-backend/constraints.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -q
      - run: python -m ruff check ../evals
      - run: python -m mypy --config-file ../evals/pyproject.toml ../evals --exclude tests
      - run: python -m pytest -q ../evals/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  production-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: contractiq-backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r contractiq-backend/requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --wait postgres redis s3
      - run: python -m pytest contractiq-backend/tests/test_infrastructure.py -q
        env:
          RUN_INFRA_TESTS: '1'
      - run: npm run test:e2e
        env:
          CI: '1'
      - if: always()
        run: docker compose down
