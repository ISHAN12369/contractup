name: contractiq
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: contractiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractiq-local-only}
      POSTGRES_DB: contractiq
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractiq -d contractiq"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  s3:
    # Ephemeral local S3 emulator only; use a private S3/R2 bucket in deployments.
    image: ghcr.io/getmoto/motoserver:5.2.3
    environment:
      MOTO_PORT: "9000"
    ports: ["127.0.0.1:9000:9000"]
  migrate:
    build: ./contractiq-backend
    env_file:
      - path: compose.env
        required: false
    environment: &backend-env
      APP_MODE: production
      DATABASE_URL: postgresql://contractiq:${POSTGRES_PASSWORD:-contractiq-local-only}@postgres:5432/contractiq
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${SUPABASE_URL:-https://configure-project.supabase.co}
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-contractiq-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-contractiq-local-password}
      S3_BUCKET: contractiq
      CORS_ORIGINS: http://localhost:3000
      MODEL_CACHE_DIR: /app/model-cache
    command: ["python", "bootstrap.py"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      s3: {condition: service_started}
  api:
    build: ./contractiq-backend
    env_file:
      - path: compose.env
        required: false
    environment: *backend-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
  worker:
    build: ./contractiq-backend
    env_file:
      - path: compose.env
        required: false
    environment: *backend-env
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--serializer", "rq.serializers.JSONSerializer", "ingestion"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_RAG_API_URL: http://localhost:8000
        NEXT_PUBLIC_AUTH_REQUIRED: "true"
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-https://configure-project.supabase.co}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-configure-publishable-key}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
